<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexAgent Console</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">FlexAgent Console</div>
            <div class="status-indicator">
                <span class="dot"></span> Online
            </div>
        </header>
        
        <main class="chat-container" id="chat-container">
            <div class="message system">
                <div class="avatar">🤖</div>
                <div class="content">
                    <p>Welcome to FlexAgent! Try asking me a question or ask me to check the local time via MCP tool.</p>
                </div>
            </div>
        </main>
        
        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="message-input" placeholder="Type a message... (Press Enter to send)" rows="1"></textarea>
                <button id="send-button" class="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
